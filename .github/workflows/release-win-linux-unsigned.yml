name: Release Win/Linux (unsigned)

# Fork-only workflow: build unsigned Windows (nsis .exe) and Linux
# (AppImage + tar.gz) Electron installers and attach them to an existing
# GitHub Release tag. macOS is intentionally excluded because it requires
# Apple code signing + notarization secrets that this fork does not have.
#
# Usage: run manually (workflow_dispatch) with the release tag (e.g. v0.21.2).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (e.g. v0.21.2)"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_type: linux
            artifact: electron-linux-x64
            electron_args: "--linux --x64"
            target_triple: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            os_type: linux
            artifact: electron-linux-arm64
            electron_args: "--linux --arm64"
            target_triple: aarch64-unknown-linux-gnu
          - platform: windows-2022
            os_type: windows
            artifact: electron-windows-x64
            electron_args: "--win --x64"
            target_triple: x86_64-pc-windows-msvc
          - platform: windows-11-arm
            os_type: windows
            artifact: electron-windows-arm64
            electron_args: "--win --arm64"
            target_triple: aarch64-pc-windows-msvc

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Enable git long paths (Windows)
        if: matrix.os_type == 'windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        shell: bash
        env:
          TARGET: ${{ matrix.target_triple }}
        run: pnpm --filter @ipollowork/desktop build:electron

      - name: Package Electron installer (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            ${{ matrix.electron_args }} \
            --publish never

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(apps/desktop/dist-electron/ipollowork-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found in apps/desktop/dist-electron" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
